# Dependabot only reads this file from the default branch (main), but this fork deploys from
# feature/frameio-keybindings, so target-branch points updates at the deploy branch.
# Node is pinned to an exact version on purpose (a floating tag never refreshes on rebuild).
# Majors are ignored for Node, and minors too for Python: a new line is a decision, not a patch.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/api
    target-branch: feature/frameio-keybindings
    schedule:
      interval: daily
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
